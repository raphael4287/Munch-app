<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Munch · 找餐廳，不靠業配</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #EFEEEA; font-family: "Noto Sans TC", -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  @keyframes munch-fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes munch-pop { from { transform: scale(0.9); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  @keyframes munch-slideup { from { transform: translateY(100%) } to { transform: translateY(0) } }
  @keyframes munch-toast {
    0% { opacity: 0; transform: translateX(-50%) translateY(-6px); }
    15% { opacity: 1; transform: translateX(-50%) translateY(0); }
    85% { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-6px); }
  }
  /* Range slider */
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    background: transparent;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 4px; background: #f0f0f0; border-radius: 4px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 22px; height: 22px; border-radius: 999px;
    background: #FF6B35; border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(255,107,53,0.4);
    margin-top: -9px;
  }
  input[type="range"]::-moz-range-track {
    height: 4px; background: #f0f0f0; border-radius: 4px;
  }
  input[type="range"]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 999px;
    background: #FF6B35; border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(255,107,53,0.4);
  }
</style>
</head>
<body style="background-color: rgb(230, 230, 230)">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
